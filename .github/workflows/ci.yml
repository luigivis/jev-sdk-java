name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      # Unit + integration tests only. The live tests against api.typesafe.ai are skipped
      # because JEV_API_KEY is not set here, so CI costs nothing and needs no key.
      - name: Build, test and verify the javadoc
        run: mvn -B verify javadoc:javadoc

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-report
          path: target/site/jacoco/
